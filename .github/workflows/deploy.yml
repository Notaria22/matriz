name: Desplegar

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: desplegar-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  produccion:
    name: Produccion (Windows + IIS)
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, windows-iis]
    steps:
      - name: Desplegar
        shell: powershell
        run: |
          Set-Location C:\matriz
          git fetch origin main
          git reset --hard origin/main
          .\deploy.ps1

  desarrollo:
    name: Desarrollo (msi-server, Docker)
    if: github.ref == 'refs/heads/develop'
    runs-on: [self-hosted, linux, matriz-dev]
    steps:
      - name: Desplegar
        shell: bash
        run: |
          cd ~/matriz
          git fetch origin develop
          git reset --hard origin/develop
          bash ./deploy.sh
